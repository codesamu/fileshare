<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <title>Home Drive</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="boot" class="boot"><span class="spinner"></span></div>

    <section id="login" class="login-screen hidden">
      <form class="login-card" id="login-form">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
        </div>
        <h1 id="login-title">Home Drive</h1>
        <p class="muted">Sign in to open your files.</p>
        <label class="field">
          <span>Password</span>
          <input id="login-password" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button class="btn primary wide" type="submit">Unlock drive</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
    </section>

    <div id="app" class="shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span id="brand-name">Home Drive</span>
        </div>
        <nav class="nav" id="nav">
          <button class="nav-item" data-nav="files">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            Files
          </button>
          <button class="nav-item" data-nav="shares">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4.5 4.5 0 0 0 6.4 0l2.1-2.1a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M13.5 10.5a4.5 4.5 0 0 0-6.4 0L5 12.6a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
            Shared links
          </button>
          <button class="nav-item" data-nav="ingest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2-8h12l2 8"/><path d="M4 13v6h16v-6"/><path d="M4 13h4l1 2h6l1-2h4"/></svg>
            Import from Samba
          </button>
        </nav>
        <div class="sidebar-foot">
          <div class="usage">
            <div class="usage-bar"><span id="usage-fill"></span></div>
            <p id="usage-text" class="muted small">—</p>
          </div>
          <button class="btn ghost small wide" id="logout">Sign out</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumbs" id="crumbs"></div>
          <div class="topbar-actions">
            <button class="btn ghost" id="new-folder">New folder</button>
            <button class="btn primary" id="upload-btn">Upload</button>
            <input type="file" id="file-input" multiple hidden />
          </div>
        </header>
        <div class="content" id="content"></div>
      </main>
    </div>

    <div class="drop-hint" id="drop-hint"><div class="drop-hint-inner">Drop files to upload</div></div>
    <div class="uploads" id="uploads" hidden></div>
    <div id="modal-root"></div>
    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
